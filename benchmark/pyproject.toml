[project]
name = "auseflux-benchmark"
version = "0.1.0"
description = "Benchmark + validation harness comparing the refactored AusEFlux pipeline against the published v2.1 product"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydap>=3.5.9",
    "rasterio>=1.5.0",
    "rioxarray>=0.22.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "xarray>=2026.4.0",
]
